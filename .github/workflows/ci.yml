name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The runners have no Homebrew DuckDB, so each job that compiles downloads
# DuckDB's prebuilt Linux library from its GitHub release. These variables
# override the Homebrew paths in .cargo/config.toml (a value already set in
# the environment wins over [env]). DUCKDB_VERSION must match the duckdb crate:
# crate 1.20000.x wraps DuckDB 2.0.x.
#
# RUSTFLAGS overrides the target-cpu=native in .cargo/config.toml. Runners vary
# in CPU, and a proc-macro cached from a newer one dies with SIGILL on an older
# one. rust-cache hashes RUSTFLAGS into its key, so changing it drops old caches.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -C target-cpu=x86-64-v2
  DUCKDB_VERSION: 2.0.0
  DUCKDB_LIB_DIR: /home/runner/libduckdb
  DUCKDB_INCLUDE_DIR: /home/runner/libduckdb
  LD_LIBRARY_PATH: /home/runner/libduckdb

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libduckdb
        run: |
          mkdir -p "$DUCKDB_LIB_DIR"
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb-shared-libs-linux-amd64.tar.gz" \
            | tar -xz -C "$DUCKDB_LIB_DIR"
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libduckdb
        run: |
          mkdir -p "$DUCKDB_LIB_DIR"
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb-shared-libs-linux-amd64.tar.gz" \
            | tar -xz -C "$DUCKDB_LIB_DIR"
      - run: cargo test --verbose

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libduckdb
        run: |
          mkdir -p "$DUCKDB_LIB_DIR"
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb-shared-libs-linux-amd64.tar.gz" \
            | tar -xz -C "$DUCKDB_LIB_DIR"
      - run: cargo build --release
